- insert:
    - id: dsh-wecom-cli-host
      name: dsh-wecom-cli
- insert:
    - id: dsh-wecom-cli-skill-provider
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: dsh-wecom-cli
        includeDefaultRoots: false
        customSkillDirs:
          - !!js "process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-wecom-cli/package.json')), 'skills')"
        watch: false
